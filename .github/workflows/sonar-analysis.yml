name: SonarQube Analysis

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: |-
            ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build, test and generate JaCoCo report
        run: mvn -B -DskipTests=false test jacoco:report

      - name: Run Sonar analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "${SONAR_HOST_URL}" ] || [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_HOST_URL and SONAR_TOKEN must be set in repository secrets to run Sonar analysis. Skipping Sonar.
" && exit 0
          fi
          mvn -B -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.login=${SONAR_TOKEN} sonar:sonar -Dsonar.projectKey=${SONAR_PROJECT_KEY}

      - name: Wait for Sonar Quality Gate and print issues if failing
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq

          echo "Polling SonarQube for quality gate..."
          for i in {1..30}; do
            resp=$(curl -s -u ${SONAR_TOKEN}: "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}")
            status=$(echo "$resp" | jq -r '.projectStatus.status')
            if [ "$status" != "PENDING" ] && [ "$status" != "IN_PROGRESS" ]; then
              echo "Quality gate status: $status"
              break
            fi
            echo "Status is $status; sleeping 5s"
            sleep 5
          done

          if [ "$status" != "OK" ]; then
            echo "Quality gate failed or unstable — fetching issues..."
            curl -s -u ${SONAR_TOKEN}: "${SONAR_HOST_URL}/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&ps=500" -o sonar_issues.json
            echo "--- Sonar issues (summary) ---"
            cat sonar_issues.json | jq -r '.issues[] | "[\(.severity)] \(.rule) at \(.component):\(.line) -> \(.message)"'

            echo "\n--- Suggested fixes (generic) ---"
            cat sonar_issues.json | jq -r '.issues[] | "Rule: \(.rule) - Suggestion: Review the issue message and apply the recommended fix in Sonar rule documentation."'

            echo "Failing workflow because quality gate not OK"
            exit 1
          else
            echo "Quality gate passed (OK)."
          fi
