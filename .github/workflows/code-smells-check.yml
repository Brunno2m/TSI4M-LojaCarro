name: Code Smells Check

on:
  pull_request:
  push:
    branches: [ "main", "master" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: |-
            ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and run tests with JaCoCo
        run: mvn -B -DskipTests=false test jacoco:report

      - name: Run Sonar analysis (if configured)
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "${SONAR_HOST_URL}" ] || [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_HOST_URL and SONAR_TOKEN not set: Skipping Sonar analysis"
            exit 0
          fi
          mvn -B -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.login=${SONAR_TOKEN} sonar:sonar -Dsonar.projectKey=${SONAR_PROJECT_KEY}

      - name: Fetch Sonar issues and print summary
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          curl -s -u ${SONAR_TOKEN}: "${SONAR_HOST_URL}/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&ps=500" -o sonar_issues.json
          echo "--- Sonar issues (summary) ---"
          cat sonar_issues.json | jq -r '.issues[] | "[\(.severity)] \(.rule) at \(.component):\(.line) -> \(.message)"' || true
          echo "\n--- Suggested fixes (generic) ---"
          cat sonar_issues.json | jq -r '.issues[] | "Rule: \(.rule) - Suggestion: Review the issue message and apply the recommended fix in Sonar rule documentation."' || true
          # Fail if any blocker/critical issues exist
          has_blocker=$(cat sonar_issues.json | jq '[.issues[] | select(.severity=="BLOCKER" or .severity=="CRITICAL")] | length')
          if [ "$has_blocker" -gt 0 ]; then
            echo "Found blocker/critical issues — failing workflow." && exit 1
          fi
