name: CI Pipeline de Testes

# Executa o pipeline sempre que houver um push ou pull request na branch main
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Máquina virtual do GitHub

    steps:
      # 1. Baixa o código do repositório para a máquina virtual
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 2. Instala o Java 17 e configura o cache do Maven
      - name: Configurar o Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Executa os testes automatizados
      - name: Rodar Testes (mvn test)
        run: mvn test