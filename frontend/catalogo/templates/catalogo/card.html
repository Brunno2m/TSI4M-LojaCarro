<article class="card"><a class="foto-link" href="{% url 'catalogo:detalhes' carro.id %}"><img src="{% url 'catalogo:foto' carro.id %}" alt="Fotografia de {{ carro.marca }} {{ carro.modelo }}" loading="lazy" width="640" height="400"></a><div class="card-body"><p class="eyebrow">{{ carro.marca }}</p><h3><a href="{% url 'catalogo:detalhes' carro.id %}">{{ carro.modelo }}</a></h3><p class="preco">R$ {{ carro.preco|floatformat:"2g" }}</p><div class="specs"><span>{{ carro.anoModelo }}</span><span>{{ carro.quilometragem|floatformat:"0g" }} km</span><span>{{ carro.tipoTransmissao }}</span></div><a class="btn btn-outline" href="{% url 'catalogo:detalhes' carro.id %}">Ver detalhes <span aria-hidden="true">→</span></a></div></article>
