
# URL do Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/carros
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracoes JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desativacao dos dados de demonstracao
app.demo-data.enabled=false

# Configuracoes do Log4j2
logging.file.name=logs/auditoria.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] - %msg%n

# Integracao legada com API de Usuarios
usuario.service.url=http://localhost:8081

# Controle da mensageria RabbitMQ
app.rabbitmq.enabled=${RABBITMQ_ENABLED:false}

# Configuracoes do servidor RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Controle dos consumidores Spring AMQP
spring.rabbitmq.listener.simple.auto-startup=${app.rabbitmq.enabled}
spring.rabbitmq.listener.direct.auto-startup=${app.rabbitmq.enabled}

# Configuracao do upload de fotografias
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Diretorio das fotografias
app.imagens.diretorio=IMG
