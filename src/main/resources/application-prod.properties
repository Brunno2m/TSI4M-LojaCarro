# URL do Banco de Dados
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/carros
spring.datasource.username=${brunno}
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracoes JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações do Log4j2
logging.file.name=logs/auditoria.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] - %msg%n

# Integração com API de Usuários
usuario.service.url=${USUARIO_SERVICE_URL:http://localhost:8081}

# RabbitMQ (Broker no IP 15.228.215.36)
spring.rabbitmq.host=${RABBITMQ_HOST:15.228.215.36}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:aluno}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:12345}
