spring.application.name=LojaCarro

spring.profiles.active=${SERVER:dev}

# URL da API do Microsserviço de Usuários
usuario.service.url=${USUARIO_SERVICE_URL:http://localhost:8081}

# Configurações do RabbitMQ (Broker no IP 15.228.215.36)
spring.rabbitmq.host=${RABBITMQ_HOST:15.228.215.36}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:aluno}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:12345}

# Definição de Fila, Exchange e Routing Key para o Módulo de Log
rabbitmq.queue.log=${RABBITMQ_QUEUE_LOG:guilherme_brunno}
rabbitmq.exchange.log=${RABBITMQ_EXCHANGE_LOG:guilherme_brunno}
rabbitmq.routingkey.log=${RABBITMQ_ROUTING_KEY_LOG:guilherme_brunno}

# Resiliência para conexões e listeners do RabbitMQ
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=5000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
