<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LojaCarro - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .card-login {
            width: 100%;
            max-width: 440px;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            background: #ffffff;
            border: none;
        }
        .login-header {
            text-align: center;
            padding-bottom: 1.5rem;
        }
        .login-header .icon-brand {
            font-size: 3rem;
            color: #1e3c72;
        }
        .btn-primary-custom {
            background-color: #1e3c72;
            border-color: #1e3c72;
        }
        .btn-primary-custom:hover {
            background-color: #162c54;
            border-color: #162c54;
        }
        .demo-credentials {
            font-size: 0.82rem;
            background-color: #f8f9fa;
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-top: 1.5rem;
            border-left: 4px solid #1e3c72;
        }
    </style>
</head>
<body>

<div class="card card-login p-4">
    <div class="login-header">
        <div class="icon-brand"><i class="bi bi-car-front-fill"></i></div>
        <h3 class="fw-bold text-dark mt-2">LojaCarro</h3>
        <p class="text-muted mb-0">Sistema Integrado de Gestão & RabbitMQ</p>
    </div>

    <!-- Mensagens de Alerta -->
    <div th:if="${erro}" class="alert alert-danger d-flex align-items-center py-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <div th:text="${erro}"></div>
    </div>

    <div th:if="${mensagem}" class="alert alert-success d-flex align-items-center py-2" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <div th:text="${mensagem}"></div>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="login" class="form-label fw-semibold">Usuário (Login)</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" class="form-control" id="login" name="login" required placeholder="Digite seu login" autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label for="senha" class="form-label fw-semibold">Senha</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="senha" name="senha" required placeholder="Digite sua senha">
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-primary-custom w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Entrar no Sistema
        </button>
    </form>

    <div class="demo-credentials">
        <div class="fw-bold mb-1 text-secondary"><i class="bi bi-info-circle me-1"></i> Credenciais Pré-configuradas (Senha: <code>12345</code>):</div>
        <div><strong>proprietario</strong> <span class="badge bg-warning text-dark">PROPRIETÁRIO (Apenas Leitura ADM)</span></div>
        <div><strong>admin</strong> <span class="badge bg-danger">SUPERUSUÁRIO</span></div>
        <div><strong>gerente</strong> <span class="badge bg-primary">GERENTE</span></div>
        <div><strong>vendedor</strong> <span class="badge bg-success">VENDEDOR</span></div>
        <div><strong>contador</strong> <span class="badge bg-info text-dark">CONTÁBIL</span></div>
    </div>
</div>

</body>
</html>
