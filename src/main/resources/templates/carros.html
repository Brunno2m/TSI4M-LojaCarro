<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Loja de Carros - IFRN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<div class="p-5 mb-4 bg-light rounded-3">
    <h1 class="display-5 fw-bold text-primary">Painel - Loja de Carros</h1>
    <p class="col-md-8 fs-4">Interface integrada com Banco de Dados MySQL e Thymeleaf.</p>
</div>

<div class="row">
    <div class="col-md-4">
        <div class="card p-4 shadow-sm">
            <h3 class="h5 mb-3 text-secondary">Cadastrar Veículo</h3>

            <form th:action="@{/painel/salvar}" th:object="${carroForm}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Modelo:</label>
                    <input type="text" th:field="*{modelo}" class="form-control" required placeholder="Ex: Civic">
                </div>
                <div class="mb-3">
                    <label class="form-label">Marca:</label>
                    <input type="text" th:field="*{marca}" class="form-control" required placeholder="Ex: Honda">
                </div>
                <div class="mb-3">
                    <label class="form-label">Ano:</label>
                    <input type="number" th:field="*{ano}" class="form-control" required placeholder="Ex: 2026">
                </div>
                <div class="mb-3">
                    <label class="form-label">Preço (R$):</label>
                    <input type="number" step="0.01" th:field="*{preco}" class="form-control" required placeholder="Ex: 120000.00">
                </div>
                <button type="submit" class="btn btn-success w-100">Salvar no Banco</button>
            </form>
        </div>
    </div>

    <div class="col-md-8">
        <div class="card p-4 shadow-sm">
            <h3 class="h5 mb-3 text-secondary">Estoque Atual</h3>
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Modelo</th>
                    <th>Marca</th>
                    <th>Ano</th>
                    <th>Preço</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${listaCarros}">
                    <td th:text="${c.id}">1</td>
                    <td th:text="${c.modelo}">Civic</td>
                    <td th:text="${c.marca}">Honda</td>
                    <td th:text="${c.ano}">2026</td>
                    <td th:text="'R$ ' + ${#numbers.formatDecimal(c.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                </tr>
                <tr th:if="${#lists.isEmpty(listaCarros)}">
                    <td colspan="5" class="text-center text-muted">Nenhum veículo em estoque no momento.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
